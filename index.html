<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzen">
<meta name="robots" content="noindex,nofollow">
<title>Finanzen im Blick</title>
<style>
/* Layout: Apple-style app shell — translucent sidebar on desktop, tab bar on phone, grouped inset lists, sheets for input */
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f2f2f7; --fg:#000000; --fg2:rgba(60,60,67,.62); --fg3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2); --bar:rgba(249,249,251,.82);
  --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500; --purple:#af52de; --teal:#30b0c7;
  --indigo:#5856d6; --pink:#ff2d55; --yellow:#e5b800; --gray:#8e8e93; --onaccent:#ffffff; --segon:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06); --scrim:rgba(0,0,0,.32);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --r:12px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --fg:#ffffff; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34); --bar:rgba(22,22,24,.82);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --purple:#bf5af2; --teal:#40c8e0;
  --indigo:#5e5ce6; --pink:#ff375f; --yellow:#ffd60a; --gray:#98989d; --onaccent:#ffffff; --segon:#636366;
  --shadow:none; --scrim:rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --fg:#ffffff; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34); --bar:rgba(22,22,24,.82);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --purple:#bf5af2; --teal:#40c8e0;
  --indigo:#5e5ce6; --pink:#ff375f; --yellow:#ffd60a; --gray:#98989d; --onaccent:#ffffff; --segon:#636366;
  --shadow:none; --scrim:rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .muted{color:var(--fg2)}

/* Shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
@media (min-width:900px){
  .app{grid-template-columns:260px 1fr}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:28px 12px 20px max(12px,env(safe-area-inset-left,0px));background:var(--bar);border-right:.5px solid var(--sep);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
  .side h2{font-size:13px;font-weight:600;color:var(--fg2);margin:0 10px 10px;text-transform:uppercase;letter-spacing:.06em}
  .side .brand{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 10px 22px;display:flex;align-items:center;gap:10px}
  .side .brand .grow{flex:1}
.side .brand .theme{width:32px;height:32px}
.side .brand .theme svg{width:18px;height:18px;color:var(--blue)}
.side .brand i{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,var(--green),var(--teal));display:grid;place-items:center;color:var(--onaccent);font-style:normal;font-size:16px}
  .side button{display:flex;align-items:center;gap:12px;padding:8px 10px;border:0;background:none;border-radius:9px;font-size:15px;text-align:left;color:var(--fg)}
  .side button svg{width:22px;height:22px;color:var(--blue);flex:none}
  .side button:hover{background:var(--fill)}
  .side button[aria-current="page"]{background:var(--blue);color:var(--onaccent)}
  .side button[aria-current="page"] svg{color:var(--onaccent)}
  .side .grow{flex:1}
  .side .sync{font-size:12px;color:var(--fg2);padding:0 10px;display:flex;align-items:center;gap:6px}
  main{padding-block:28px 60px}
  .tabbar{display:none!important}
}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--gray);padding:2px 0}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-current="page"]{color:var(--blue)}

/* Header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px}
.head h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1;text-wrap:balance}
.head .sub{font-size:15px;color:var(--fg2);margin-top:4px}
.head .actions{display:flex;gap:8px;align-items:center}
@media (max-width:899px){.head{flex-direction:column-reverse;align-items:stretch;gap:6px}.head .actions{justify-content:flex-end}}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.iconbtn.primary{background:var(--blue);color:var(--onaccent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--fill);color:var(--blue);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:500}
.pill.solid{background:var(--blue);color:var(--onaccent)}
.pill.danger{color:var(--red)}
.mobile-only{display:inline-grid}
@media (min-width:900px){.mobile-only{display:none}}

/* Banner */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:color-mix(in srgb,var(--blue) 10%,var(--card));border-radius:var(--r);padding:12px 16px;font-size:15px}
.banner b{font-weight:600}

/* Sections & grouped lists */
.section{display:flex;flex-direction:column;gap:8px;min-width:0}
.section>.label{flex-wrap:wrap;row-gap:8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 16px}
.section>.label h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.section>.label .link{border:0;background:none;color:var(--blue);font-size:15px;padding:0}
.section>.caps{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);padding:0 16px}
.foot{font-size:13px;color:var(--fg2);padding:0 16px;line-height:1.4;max-width:70ch}
.group{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;position:relative;width:100%;border:0;background:none;text-align:left}
button.row:hover{background:var(--fill)}
button.row:active{background:var(--fill2)}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.row.has-ic{--inset:60px}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-size:17px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .v small{display:block;font-size:13px;color:var(--fg2)}
.chev{width:8px;height:13px;color:var(--fg3);flex:none}
.ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--onaccent);font-weight:600;font-size:15px;flex:none}
.empty{padding:28px 20px;text-align:center;color:var(--fg2);font-size:15px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* Cards */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.card .k{font-size:13px;color:var(--fg2);font-weight:500}
.card .big{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--shadow);display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:700px){.hero{grid-template-columns:1.2fr 1fr;align-items:center}}
.hero .k{font-size:15px;color:var(--fg2);font-weight:500}
.hero .huge{font-size:clamp(36px,7vw,52px);font-weight:700;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .split{display:flex;flex-direction:column;gap:10px}
.hero .split div{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:baseline}
.stack{height:10px;border-radius:5px;background:var(--fill);overflow:hidden;display:flex}
.stack span{height:100%}

/* Progress */
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;width:100%}
.bar span{display:block;height:100%;border-radius:3px;background:var(--green)}
.bar.warn span{background:var(--orange)} .bar.over span{background:var(--red)} .bar.blue span{background:var(--blue)}
.brow{display:flex;flex-direction:column;gap:7px;padding:12px 16px;position:relative;width:100%;border:0;background:none;text-align:left}
button.brow:hover{background:var(--fill)}
.brow+.brow::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.brow .top{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.brow .top .num{white-space:nowrap}
.brow .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--fg2)}

/* Segmented, month switch */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px;max-width:100%}
.seg button{border:0;background:none;border-radius:7px;padding:6px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.month{display:inline-flex;align-items:center;gap:4px;background:var(--fill);border-radius:999px;padding:2px}
.month button{border:0;background:none;color:var(--blue);width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.month button:hover{background:var(--fill)}
.month span{font-size:15px;font-weight:600;min-width:118px;text-align:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:160px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:7px 10px;color:var(--fg2)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--fg);font-size:16px}
.select{border:0;background:var(--fill);border-radius:10px;padding:8px 10px;font-size:15px;color:var(--fg)}

/* Status chips */
.chip{display:inline-flex;align-items:center;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.chip.orange{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.chip.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.chip.gray{background:var(--fill);color:var(--fg2)}
.chip.purple{background:color-mix(in srgb,var(--purple) 15%,transparent);color:var(--purple)}
.tablewrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto;min-width:0}
.tablewrap.tall{max-height:440px;overflow-y:auto}
table.dt{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.dt th{position:sticky;top:0;background:var(--card);z-index:1;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);font-weight:600;text-align:left;padding:10px 14px;border-bottom:.5px solid var(--sep);white-space:nowrap}
.dt td{padding:10px 14px;border-bottom:.5px solid var(--sep);white-space:nowrap;vertical-align:middle}
.dt td.cellwrap{white-space:normal;min-width:100px}
.dt td.az{overflow-wrap:anywhere;min-width:90px}
@media (max-width:1279px){.dt th,.dt td{padding-left:10px;padding-right:10px}.dt th{white-space:normal}.dt .chip{white-space:normal;text-align:center}}
.dt td b{font-weight:600}
.dt tbody tr:last-child td{border-bottom:0}
.dt tbody tr[data-act]{cursor:pointer}
.dt tbody tr[data-act]:hover,.dt tbody tr[data-act]:focus-visible{background:var(--fill);outline:none}
.dt .r{text-align:right} .dt .c{text-align:center}
.dt tr.cur td{background:color-mix(in srgb,var(--blue) 9%,var(--card))}
.dt tr.done td:not(.c){color:var(--fg2)}
.rp td,.rp th{padding-left:10px;padding-right:10px}
.check{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--fg3);background:none;display:inline-grid;place-items:center;color:transparent;padding:0;flex:none;transition:background .15s}
.check svg{width:15px;height:15px}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--onaccent)}
.more{border:0;background:none;color:var(--blue);font-size:13px;letter-spacing:1px;padding:4px 6px;border-radius:6px}
.more:hover{background:var(--fill)}
.debthead .row{min-height:48px}
.datebtn{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.datebtn.neg{color:var(--red)}
.debthead .s{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scrim.noanim,.scrim.noanim .sheet{animation:none}
.only-narrow{display:none}
@media (max-width:1059px){.only-wide{display:none}.only-narrow{display:block}}
@media (max-width:699px){.dt{font-size:14px}.dt th,.dt td{padding-left:8px;padding-right:8px}.rp th:last-child,.rp td:last-child{display:none}}
.chip.blue{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}

/* Debt cards */
.dgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.dcard{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0;border:0;text-align:left;width:100%}
.dcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dcard .name{font-size:17px;font-weight:600}
.dcard .who{font-size:14px;color:var(--fg2)}
.dcard .amt{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dcard .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;color:var(--fg2)}
.dcard .facts b{display:block;color:var(--fg);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.dcard .btns{display:flex;gap:8px;flex-wrap:wrap}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:14px 14px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@media (min-width:700px){.sheet{border-radius:16px;max-height:88vh}}
.sheet .bar-top{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.sheet .bar-top h4{margin:0;font-size:17px;font-weight:600;text-align:center}
.sheet .bar-top button{border:0;background:none;color:var(--blue);font-size:17px;padding:0}
.sheet .bar-top .ok{justify-self:end;font-weight:600}
.sheet .bar-top .cancel{justify-self:start}
.sheet .body{padding:20px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.form{background:var(--card);border-radius:var(--r);overflow:hidden}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.field label{flex:none;min-width:110px;font-size:16px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;outline:none;text-align:right;font-size:16px;color:var(--fg);padding:12px 0}
.field select{direction:rtl;appearance:none;-webkit-appearance:none;color:var(--fg2)}
.field select option{direction:ltr}
.field textarea{text-align:left;resize:vertical;min-height:64px}
.field.col{flex-direction:column;align-items:stretch;gap:0;padding-top:10px}
.field.col label{font-size:13px;color:var(--fg2)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:12px 16px 4px}
.amount input{border:0;background:none;outline:none;font-size:44px;font-weight:700;letter-spacing:-.03em;text-align:center;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.amount span{font-size:30px;font-weight:600;color:var(--fg2)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px}
.swatches button{width:30px;height:30px;border-radius:50%;border:0;box-shadow:inset 0 0 0 2px transparent}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg3)}
.hint{font-size:13px;color:var(--fg2);padding:0 16px;margin-top:-14px;line-height:1.4}
.sheet .danger{width:100%;border:0;background:var(--card);border-radius:var(--r);color:var(--red);padding:13px;font-size:17px}
.sheet .danger.armed{background:var(--red);color:var(--onaccent);font-weight:600}
.err{color:var(--red);font-size:14px;padding:0 16px;margin-top:-12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:32px}}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--gray);display:inline-block}
.syncdot.ok{background:var(--green)} .syncdot.busy{background:var(--orange)} .syncdot.err{background:var(--red)}
.two{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:1100px){.two{grid-template-columns:1fr 1fr}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)} html,body{margin:0} [hidden]{display:none!important}</style>
</head>
<body>

<div class="app">
  <nav class="side" aria-label="Bereiche" id="side"></nav>
  <main><div class="wrap" id="view"></div></main>
  <nav class="tabbar" aria-label="Bereiche" id="tabs"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

/* ---------- GitHub ---------- */
const ghUrl=()=>`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${gh.path.split('/').filter(Boolean).map(encodeURIComponent).join('/')}`;
const ghHeaders=(accept)=>({'Authorization':'Bearer '+gh.token,'Accept':accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b64){const bin=atob(b64.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function ghErr(s){return ({401:'Der Token ist ungültig oder abgelaufen.',403:'Der Token hat keine Rechte für dieses Repository (Contents: Read and write) oder das GitHub-Limit ist erreicht.',404:'Repository nicht gefunden. Prüfe Benutzername, Repository, Branch und ob der Token Zugriff auf dieses Repository hat.',422:'GitHub hat die Daten abgelehnt.'})[s]||('GitHub meldet Fehler '+s+'.')}
function netErr(e){return e instanceof TypeError?'Keine Verbindung zu GitHub. Deine Änderungen sind lokal gespeichert und werden beim nächsten Mal hochgeladen.':(e&&e.message)||'Unbekannter Fehler.'}
async function ghGet(){
  const q='?ref='+encodeURIComponent(gh.branch)+'&_='+Date.now();
  const r=await fetch(ghUrl()+q,{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404){
    const rr=await fetch(`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}`,{headers:ghHeaders(),cache:'no-store'});
    if(!rr.ok)throw new Error(ghErr(rr.status===404?404:rr.status));
    return {missing:true};
  }
  if(!r.ok)throw new Error(ghErr(r.status));
  const j=await r.json();
  if(Array.isArray(j))throw new Error('„'+gh.path+'“ ist ein Ordner. Gib den Pfad zur Datei an, z. B. data.json.');
  let text;
  if(j.content&&j.encoding==='base64')text=b64dec(j.content);
  else{const r2=await fetch(ghUrl()+q,{headers:ghHeaders('application/vnd.github.raw+json'),cache:'no-store'});if(!r2.ok)throw new Error(ghErr(r2.status));text=await r2.text()}
  let data=null;
  try{data=text.trim()?JSON.parse(text):null}catch(e){throw new Error('Die Datei „'+gh.path+'“ enthält kein gültiges JSON.')}
  return {sha:j.sha,data:(data&&Array.isArray(data.accounts))?data:null};
}
async function ghPut(){
  const body={message:'Finanzen aktualisiert · '+new Date().toLocaleString('de-DE'),content:b64enc(JSON.stringify(state,null,1)),branch:gh.branch};
  if(store.sha)body.sha=store.sha;
  return fetch(ghUrl(),{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(body)});
}
async function flush(){
  clearTimeout(store.timer);store.timer=null;
  if(!gh)return;
  if(store.saving){store.again=true;return}
  store.saving=true;setSync('busy');
  try{
    let r=await ghPut();
    if(r.status===409||r.status===422){
      const g=await ghGet();
      if(g.data&&(g.data.updated||0)>(state.updated||0)){store.sha=g.sha;adopt(g.data);toast('Neuere Daten von einem anderen Gerät geladen');store.saving=false;setSync('ok');return}
      store.sha=g.missing?null:g.sha;r=await ghPut();
    }
    if(!r.ok)throw new Error(ghErr(r.status));
    const j=await r.json();store.sha=j.content&&j.content.sha;setSync('ok');
  }catch(e){store.error=netErr(e);setSync('err')}
  store.saving=false;
  if(store.again){store.again=false;flush()}
}
/* ---------- Zugangsdatei (verschlüsselter Token für alle Geräte) ---------- */
const ACCESS_FILE='zugang.json',ITER=310000;
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptAccess(cfg,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pass,salt,ITER);
  const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(cfg)));
  return {app:'finanzen-im-blick',v:1,iter:ITER,salt:b64(salt),iv:b64(iv),data:b64(data)};
}
async function decryptAccess(f,pass){
  const key=await deriveKey(pass,unb64(f.salt),f.iter||ITER);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(f.iv)},key,unb64(f.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
let accessFile=null;
async function checkAccessFile(){
  if(gh||!window.crypto||!crypto.subtle)return;
  try{if(sessionStorage.getItem('finanzen-skip-unlock'))return}catch(e){}
  try{const r=await fetch(ACCESS_FILE+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;const f=await r.json();if(f&&f.app==='finanzen-im-blick'&&f.data){accessFile=f;unlockSheet()}}catch(e){}
}

async function pull(manual){
  if(!gh){setSync('local');return}
  if(store.saving||store.timer)return;
  setSync('busy');
  try{
    const g=await ghGet();
    store.sha=g.missing?null:g.sha;
    if(!g.data){
      if(state.demo)adopt(emptyState());
      store.saving=false;await flush();if(manual)toast('Datei auf GitHub angelegt');return;
    }
    const rem=g.data.updated||0,loc=state.updated||0;
    if(state.demo||rem>loc){adopt(g.data);if(manual)toast('Daten von GitHub geladen')}
    else if(loc>rem){await flush();if(manual)toast('Lokale Änderungen hochgeladen');return}
    else if(manual)toast('Alles ist aktuell');

  }catch(e){store.error=netErr(e);setSync('err')}
}

/* ===================== Berechnungen ===================== */
const acc=id=>state.accounts.find(a=>a.id===id);
const cat=id=>state.categories.find(c=>c.id===id);
function txDelta(a){let s=0;for(const t of state.tx){if(t.accountId===a.id)s+=t.type==='in'?t.amount:-t.amount;if(t.type==='transfer'&&t.toAccountId===a.id)s+=t.amount}return s}
const balance=a=>(a.start||0)+txDelta(a);
const curKey=()=>mkey(ui.y,ui.m);
const monthTx=k=>state.tx.filter(t=>t.date.startsWith(k));
function monthSums(k){let i=0,o=0;for(const t of monthTx(k)){if(t.type==='in')i+=t.amount;else if(t.type==='out')o+=t.amount}return {i,o}}
function spentBy(k){const r={};for(const t of monthTx(k))if(t.type==='out')r[t.category||'sonst']=(r[t.category||'sonst']||0)+t.amount;return r}
const r2=v=>Math.round((+v||0)*100)/100;
const daysIn=(y,m)=>new Date(y,m,0).getDate();
function monthDate(offset,day){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(Math.min(day||1,daysIn(d.getFullYear(),d.getMonth()+1)))}
function planRates(amount,rate,first,step){
  const out=[];amount=r2(amount);if(!(amount>0)||!first)return out;
  if(!(rate>0)||!step){out.push({date:first,amount});return out}
  let [y,m,d]=first.split('-').map(Number),left=amount,i=0;
  while(left>0.004&&i<600){out.push({date:`${y}-${pad(m)}-${pad(Math.min(d,daysIn(y,m)))}`,amount:r2(Math.min(rate,left))});left=r2(left-rate);m+=step;while(m>12){m-=12;y++}i++}
  return out;
}
const sortedRates=d=>[...d.rates].sort((a,b)=>a.date.localeCompare(b.date));
const paidSum=d=>r2(d.rates.reduce((s,x)=>s+(x.paid?x.amount:0),0));
const plannedSum=d=>r2(d.rates.reduce((s,x)=>s+x.amount,0));
const rest=d=>Math.max(0,r2((+d.total||0)-paidSum(d)));
const paidTotal=paidSum;
const nextRate=d=>sortedRates(d).find(x=>!x.paid);
const overdueRates=d=>d.rates.filter(x=>!x.paid&&x.date<today());
const planGap=d=>Math.max(0,r2((+d.total||0)-plannedSum(d)));
function planEnd(d){let c=0;for(const x of sortedRates(d)){c=r2(c+x.amount);if(c>=(+d.total||0)-0.004)return x.date}return null}
const debtTitle=d=>d.firma||d.inkasso||'Ohne Namen';
function migrateDebt(d,tx){
  if(Array.isArray(d.rates)){d.status||='auto';return d}
  const pays=d.payments||[];
  const n={id:d.id||newId(),dir:d.dir||'owe',kind:d.kind||'sonst',inkasso:'',firma:d.person||d.name||'',az:'',total:r2(+d.opening||+d.original||0),accountId:'',status:'auto',
    note:[d.person&&d.name?d.name:'',d.note||''].filter(Boolean).join(' · '),
    rates:pays.map(p=>({id:p.id||newId(),date:p.date,amount:r2(p.amount-(p.interest||0)),paid:true,txId:p.txId}))};
  n.rates.forEach(x=>{const t=x.txId&&tx.find(t=>t.id===x.txId);if(t)t.rateId=x.id});
  const left=rest(n);
  if(left>0){if(+d.monthly>0)n.rates.push(...planRates(left,+d.monthly,monthDate(1,1),1).map(x=>({id:newId(),...x,paid:false})));else if(d.due)n.rates.push({id:newId(),date:d.due,amount:left,paid:false})}
  return n;
}
function setPaid(d,x,paid){
  x.paid=paid;
  if(paid&&d.accountId&&acc(d.accountId)&&!x.txId){
    const owe=d.dir==='owe';
    const t={id:newId(),date:x.date>today()?today():x.date,type:owe?'out':'in',amount:x.amount,accountId:d.accountId,
      category:owe?(cat('schulden')?'schulden':''):(cat('einnahme')?'einnahme':''),note:(owe?'Rate ':'Rückzahlung ')+debtTitle(d),debtId:d.id,rateId:x.id};
    state.tx.push(t);x.txId=t.id;
  }
  if(!paid&&x.txId){state.tx=state.tx.filter(t=>t.id!==x.txId);delete x.txId}
}
function debtStatus(d){
  if(rest(d)<=0)return '<span class="chip green">Erledigt</span>';
  if(d.status&&d.status!=='auto')return `<span class="chip purple">${esc(DEBT_STATUS[d.status]||d.status)}</span>`;
  const od=overdueRates(d);
  if(od.length)return `<span class="chip red">${od.length===1?'Rate':od.length+' Raten'} überfällig</span>`;
  const n=nextRate(d);
  if(!n)return '<span class="chip gray">Kein Ratenplan</span>';
  const days=daysUntil(n.date);
  if(days<=7)return `<span class="chip orange">${days===0?'Heute fällig':'Fällig in '+days+(days===1?' Tag':' Tagen')}</span>`;
  return '<span class="chip blue">Zahlungen offen</span>';
}
function payTimeline(debts){
  const rows=[],ds=debts.filter(d=>d.rates.length);if(!ds.length)return rows;
  const dates=ds.flatMap(d=>d.rates.map(x=>x.date)).sort();
  let [y,m]=dates[0].split('-').map(Number);const [ey,em]=dates[dates.length-1].split('-').map(Number);
  const nowK=today().slice(0,7),starts=new Map(ds.map(d=>[d.id,sortedRates(d)[0].date.slice(0,7)]));
  let guard=0;
  while((y<ey||(y===ey&&m<=em))&&guard++<600){
    const k=y+'-'+pad(m);let planned=0,paid=0,rem=0;
    for(const d of ds){
      for(const x of d.rates)if(x.date.slice(0,7)===k){planned+=x.amount;if(x.paid)paid+=x.amount}
      if(starts.get(d.id)>k)continue;
      const v=k<=nowK?(+d.total||0)-d.rates.filter(x=>x.paid&&x.date.slice(0,7)<=k).reduce((s,x)=>s+x.amount,0)
        :rest(d)-d.rates.filter(x=>!x.paid&&x.date.slice(0,7)<=k).reduce((s,x)=>s+x.amount,0);
      rem+=Math.max(0,v);
    }
    rows.push({k,y,m,planned:r2(planned),paid:r2(paid),rem:r2(rem),cur:k===nowK,past:k<nowK});
    m++;if(m>12){m=1;y++}
  }
  return rows;
}
const monthlyOf=f=>f.interval==='monthly'?f.amount:f.interval==='quarterly'?f.amount/3:f.amount/12;
function fixedDue(f,m){ if(f.interval==='monthly')return true; const s=(+f.month||1)-1; if(f.interval==='yearly')return m===s; return ((m-s)%3+3)%3===0 }
function totals(){
  const assets=state.accounts.reduce((s,a)=>s+balance(a),0);
  const owe=state.debts.filter(d=>d.dir==='owe').reduce((s,d)=>s+rest(d),0);
  const owed=state.debts.filter(d=>d.dir==='owed').reduce((s,d)=>s+rest(d),0);
  return {assets,owe,owed,net:assets-owe+owed};
}

    </tbody></table></div>
    <p class="foot">Vergangene Monate zeigen, was tatsächlich bezahlt wurde. Ab dem aktuellen Monat ist „Noch offen“ die Planung laut Ratenplänen. Rot heißt: In diesem Monat wurde weniger gezahlt als geplant.</p></section>`:''}`;
}

let sheet=null;
function openSheet({title,body,save,del,saveLabel='Sichern',back,keep}){
  const old=document.querySelector('#sheetRoot .sheet'),top=keep&&old?old.scrollTop:0;
  sheet={save,del,back};
  document.getElementById('sheetRoot').innerHTML=`<div class="scrim${keep?' noanim':''}" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="bar-top"><button class="cancel" data-act="close">Abbrechen</button><h4>${esc(title)}</h4>${save?`<button class="ok" data-act="save">${saveLabel}</button>`:'<span></span>'}</div>
    <form class="body" id="sheetform" autocomplete="off">${body}${del?`<button type="button" class="danger" data-act="del">${esc(del.label||'Löschen')}</button>`:''}<div id="sheeterr"></div></form></div></div>`;
  const f=document.querySelector('#sheetform input:not([type=hidden]):not([type=date]),#sheetform select');
  if(keep){document.querySelector('#sheetRoot .sheet').scrollTop=top}
  else if(f&&!('ontouchstart' in window))setTimeout(()=>{if(!document.activeElement||document.activeElement===document.body)f.focus()},60);
  document.getElementById('sheetform').addEventListener('submit',e=>{e.preventDefault();doSave()});
}
function closeSheet(){sheet=null;document.getElementById('sheetRoot').innerHTML=''}
function sheetErr(m){document.getElementById('sheeterr').innerHTML=`<p class="err">${esc(m)}</p>`}
function doSave(){if(!sheet||!sheet.save)return;const b=sheet.back;const r=sheet.save();if(r===false)return;closeSheet();b&&b()}
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const field=(label,input)=>`<div class="field"><label>${label}</label>${input}</div>`;
const sel=(id,opts,cur)=>`<select id="${id}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const accOpts=(none)=>[...(none?[['',none]]:[]),...state.accounts.map(a=>[a.id,a.name])];
const swatches=(cur)=>`<div class="swatches" role="group" aria-label="Farbe">${COLORS.map(c=>`<button type="button" data-act="swatch" data-v="${c}" aria-label="${c}" aria-pressed="${c===cur}" style="background:var(--${c})"></button>`).join('')}<input type="hidden" id="f_color" value="${cur}"></div>`;

function txSheet(t){
  const isNew=!t;t=t||{type:'out',date:today(),amount:'',accountId:(state.accounts[0]||{}).id||'',category:'',note:''};
  if(!state.accounts.length){toast('Lege zuerst ein Konto an.');accSheet();return}
  const catsFor=k=>state.categories.filter(c=>c.kind===k).map(c=>[c.id,c.name]);
  const body=()=>`
    <div style="display:flex;justify-content:center"><div class="seg" role="group" aria-label="Art">${[['out','Ausgabe'],['in','Einnahme'],['transfer','Umbuchung']].map(([v,l])=>`<button type="button" data-act="txtype" data-v="${v}" aria-pressed="${t.type===v}">${l}</button>`).join('')}</div></div>
    <div class="form"><div class="amount"><input id="f_amount" inputmode="decimal" placeholder="0,00" value="${numIn(t.amount)}" aria-label="Betrag"><span>€</span></div></div>
    <div class="form">
      ${field('Beschreibung',`<input id="f_note" placeholder="z. B. Supermarkt" value="${esc(t.note)}">`)}
      ${field('Datum',`<input id="f_date" type="date" value="${t.date}">`)}
      ${field(t.type==='transfer'?'Von Konto':'Konto',sel('f_acc',accOpts(),t.accountId))}
      ${t.type==='transfer'?field('Auf Konto',sel('f_to',accOpts(),t.toAccountId||(state.accounts[1]||{}).id)):field('Kategorie',sel('f_cat',catsFor(t.type),t.category||catsFor(t.type)[0]?.[0]))}
    </div>
    ${t.debtId?'<p class="hint">Diese Buchung gehört zu einer abgehakten Rate unter „Schulden & Kredite“. Löschst du sie, wird die Rate wieder offen.</p>':''}`;
  const draw=()=>{const form=document.getElementById('sheetform');const keep={amount:val('f_amount'),note:val('f_note'),date:val('f_date')};form.innerHTML=body()+(isNew?'':`<button type="button" class="danger" data-act="del">Buchung löschen</button>`)+'<div id="sheeterr"></div>';document.getElementById('f_amount').value=keep.amount;document.getElementById('f_note').value=keep.note;document.getElementById('f_date').value=keep.date||today()};
  openSheet({title:isNew?'Neue Buchung':'Buchung',body:body(),
    del:isNew?null:{label:'Buchung löschen',run:()=>{state.tx=state.tx.filter(x=>x.id!==t.id);if(t.debtId){const d=state.debts.find(x=>x.id===t.debtId);const r=d&&d.rates.find(x=>x.txId===t.id);if(r){r.paid=false;delete r.txId}}commit('Buchung gelöscht')}},
    save:()=>{
      const amount=parseNum(val('f_amount'));if(!(amount>0)){sheetErr('Bitte einen Betrag größer als 0 eingeben.');return false}
      const o={id:t.id||newId(),type:t.type,amount:Math.round(amount*100)/100,date:val('f_date')||today(),accountId:val('f_acc'),note:val('f_note').trim()};
      if(t.type==='transfer'){o.toAccountId=val('f_to');o.category='';if(o.toAccountId===o.accountId){sheetErr('Von- und Auf-Konto müssen verschieden sein.');return false}}else o.category=val('f_cat');
      if(t.debtId){o.debtId=t.debtId;const d=state.debts.find(x=>x.id===t.debtId);const r=d&&d.rates.find(x=>x.txId===t.id);if(r){r.amount=o.amount}if(t.rateId)o.rateId=t.rateId}
      if(isNew)state.tx.push(o);else state.tx=state.tx.map(x=>x.id===t.id?o:x);

function planSheet(d){
  const hasOpen=d.rates.some(x=>!x.paid);
  const last=sortedRates(d).pop();
  const nm=monthDate(1,1);
  openSheet({title:'Ratenplan erstellen',saveLabel:'Erstellen',back:()=>debtDetail(state.debts.find(z=>z.id===d.id)),body:`
    <div class="form">
      ${field('Offene Raten',sel('p_mode',[['replace','Ersetzen'],['add','Behalten, Rest dazu']],hasOpen&&planGap(d)<=0?'replace':'add'))}
      ${field('Rate',`<input id="p_rate" inputmode="decimal" placeholder="z. B. 20,00 €" value="${numIn(d.rates.find(x=>!x.paid)?.amount||'')}">`)}
      ${field('Erster Zahltag',`<input id="p_first" type="date" value="${last&&last.date>=today()&&!(hasOpen&&planGap(d)<=0)?(()=>{const [y,m,dd]=last.date.split('-').map(Number);return (m===12?y+1:y)+'-'+pad(m===12?1:m+1)+'-'+pad(dd)})():nm}">`)}
      ${field('Rhythmus',sel('p_step',STEPS,1))}
    </div>
    <p class="hint" id="p_preview"></p>`,
    save:()=>{
      const mode=val('p_mode'),rate=parseNum(val('p_rate')),first=val('p_first'),step=+val('p_step');
      if(!first){sheetErr('Bitte den ersten Zahltag wählen.');return false}
      const amount=mode==='replace'?rest(d):planGap(d);
      if(!(amount>0)){sheetErr('Es ist nichts mehr zu verplanen.');return false}
      if(mode==='replace')d.rates=d.rates.filter(x=>x.paid);
      const n=planRates(amount,rate,first,step).map(x=>({id:newId(),...x,paid:false}));
      d.rates.push(...n);
      commit(n.length+(n.length===1?' Rate':' Raten')+' angelegt');
    }});
  sheet.debtId=d.id;sheet.preview=()=>{
    const mode=val('p_mode'),amount=mode==='replace'?rest(d):planGap(d),p=planRates(amount,parseNum(val('p_rate')),val('p_first'),+val('p_step'));
    const el=document.getElementById('p_preview');if(!el)return;
    el.textContent=!(amount>0)?'Es ist nichts mehr zu verplanen.':!p.length?'':`${money(amount)} werden verplant: ${p.length} ${p.length===1?'Zahlung':'Raten'}, letzte am ${fmtDate(p[p.length-1].date)} über ${money(p[p.length-1].amount)}.`;
  };
  sheet.preview();
}

/* ===================== Aktionen ===================== */
function toast(m){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2400)}
function go(v){ui.view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}
async function download(name,data,type){
  const plain=()=>{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
  if(!window.claude||typeof window.claude.use!=='function'){plain();return}
  try{const dl=await claude.use('downloads');if(!dl){plain();return}
    await dl.save({filename:name,data:new Blob([data],{type})})}catch(e){if(e&&e.code!=='cancelled')toast('Download wurde nicht gespeichert.')}
}
let armed=null;
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='scrim'){if(e.target===el){const b=sheet&&sheet.back;closeSheet();b&&b()}return}
  e.preventDefault&&el.tagName==='BUTTON'&&e.preventDefault();
  switch(a){
    case 'themeset':{const v=el.dataset.v;try{v==='auto'?localStorage.removeItem(THEME_KEY):localStorage.setItem(THEME_KEY,v)}catch(_){}applyTheme(v==='auto'?null:v);render();break}
    case 'theme':{const t=isDark()?'light':'dark';try{localStorage.setItem(THEME_KEY,t)}catch(_){}applyTheme(t);render();toast(t==='dark'?'Dunkler Modus':'Heller Modus');break}
    case 'close':{const b=sheet&&sheet.back;closeSheet();b&&b();break}
    case 'save':doSave();break;
    case 'del':
      if(armed!==el){armed=el;el.classList.add('armed');el.textContent='Wirklich löschen? Nochmal tippen';setTimeout(()=>{if(armed===el){armed=null;el.classList.remove('armed');el.textContent=sheet&&sheet.del?sheet.del.label:'Löschen'}},3500);break}
      armed=null;const run=sheet&&sheet.del&&sheet.del.run,bk=sheet&&sheet.back;closeSheet();run&&run();bk&&bk();break;
    case 'swatch':document.querySelectorAll('.swatches button').forEach(b=>b.setAttribute('aria-pressed',b===el));document.getElementById('f_color').value=el.dataset.v;break;
    case 'txtype':sheet&&sheet.setType&&sheet.setType(el.dataset.v);break;
    case 'mprev':ui.m--;if(ui.m<0){ui.m=11;ui.y--}render();break;
    case 'mnext':ui.m++;if(ui.m>11){ui.m=0;ui.y++}render();break;
    case 'txf':ui.txFilter=el.dataset.v;render();break;
    case 'ddir':ui.debtDir=el.dataset.v;render();break;
    case 'newtx':txSheet();break;
    case 'edittx':txSheet(JSON.parse(JSON.stringify(state.tx.find(t=>t.id===id))));break;
    case 'newacc':accSheet();break;
    case 'editacc':accSheet(state.accounts.find(x=>x.id===id));break;
    case 'newcat':catSheet();break;
    case 'editcat':catSheet(cat(id));break;
    case 'newfixed':fixedSheet();break;
    case 'editfixed':fixedSheet(state.fixed.find(x=>x.id===id));break;
    case 'bookfixed':{const k=curKey();let n=0;state.fixed.filter(f=>fixedDue(f,ui.m)&&!f.booked.includes(k)).forEach(f=>{if(f.accountId)state.tx.push({id:newId(),date:k+'-01',type:f.kind,amount:f.amount,accountId:f.accountId,category:f.category,note:f.name});f.booked.push(k);n++});commit(n+' Fixposten gebucht');break}
    case 'newdebt':debtSheet();break;
    case 'editdebt':debtSheet(state.debts.find(x=>x.id===id));break;
    case 'debt':debtDetail(state.debts.find(x=>x.id===id));break;
    case 'dfilt':ui.debtFilter=el.dataset.v;render();break;
    case 'ratepaid':{const d=state.debts.find(x=>x.id===id),x=d&&d.rates.find(z=>z.id===el.dataset.r);if(!x)break;setPaid(d,x,!x.paid);commit(x.paid?(rest(d)<=0?'Komplett erledigt 🎉':'Als bezahlt abgehakt'):'Wieder als offen markiert');if(sheet&&sheet.debtId===d.id&&!sheet.save)debtDetail(d,true);break}
    case 'addrate':rateSheet(state.debts.find(x=>x.id===id));break;
    case 'editrate':{const d=state.debts.find(x=>x.id===id);rateSheet(d,d.rates.find(z=>z.id===el.dataset.r));break}
    case 'plan':planSheet(state.debts.find(x=>x.id===id));break;
    case 'copy':{const v=el.dataset.v;try{navigator.clipboard.writeText(v).then(()=>toast('Aktenzeichen kopiert'),()=>toast(v))}catch(_){toast(v)}break}
    case 'cleardemo':state=emptyState();commit('Bereit für deine eigenen Daten');go('konten');break;
    case 'loaddemo':
      if(armed!==el){armed=el;el.querySelector('.t').textContent='Sicher? Deine Daten werden ersetzt. Nochmal tippen';break}
      armed=null;state=makeDemo();state.updated=Date.now();saveLocal();queueRemote();go('uebersicht');break;
    case 'reset':
      if(armed!==el){armed=el;el.querySelector('.t').textContent='Wirklich alles löschen? Nochmal tippen';break}
      armed=null;state=emptyState();commit('Alle Daten gelöscht');break;
    case 'ghsync':pull(true);break;
    case 'ghoff':
      if(armed!==el){armed=el;el.textContent='Wirklich trennen? Nochmal tippen';break}
      armed=null;gh=null;saveGh(null);store.sha=null;setSync('local');render();toast('Verbindung getrennt. Deine Daten bleiben in diesem Browser.');break;
    case 'unlock':if(accessFile)unlockSheet();break;
    case 'mkaccess':{
      const p1=val('a_pass'),p2=val('a_pass2');
      if(p1.length<10){toast('Der Passwort-Satz braucht mindestens 10 Zeichen.');break}
      if(p1!==p2){toast('Die beiden Eingaben stimmen nicht überein.');break}
      if(!window.crypto||!crypto.subtle){toast('Verschlüsselung geht nur über https, also auf deiner GitHub-Seite.');break}
      encryptAccess(gh,p1).then(f=>{download(ACCESS_FILE,JSON.stringify(f,null,1),'application/json');toast('zugang.json erstellt. Jetzt ins Repo der index.html hochladen.')}).catch(()=>toast('Die Datei konnte nicht erstellt werden.'));
      break}
    case 'ghconnect':{
      const c={owner:val('gh_owner').trim(),repo:val('gh_repo').trim(),branch:val('gh_branch').trim()||'main',path:(val('gh_path').trim()||'data.json').replace(/^\/+/,''),token:val('gh_token').trim()||(gh&&gh.token)||''};
      if(!c.owner||!c.repo||!c.token){toast('Bitte Benutzername, Repository und Token ausfüllen.');break}
      const old=gh;gh=c;store.sha=null;setSync('busy');
      ghGet().then(()=>{saveGh(c);render();pull(true)}).catch(err=>{gh=old;store.error=netErr(err);setSync('err');toast(store.error)});
      break}
    case 'export':download('finanzen-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');break;
    case 'csv':{const rows=[['Datum','Art','Betrag','Konto','Zielkonto','Kategorie','Beschreibung']].concat([...state.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,{in:'Einnahme',out:'Ausgabe',transfer:'Umbuchung'}[t.type],String(t.type==='out'?-t.amount:t.amount).replace('.',','),acc(t.accountId)?.name||'',acc(t.toAccountId)?.name||'',cat(t.category)?.name||'',t.note||'']));
      download('buchungen-'+today()+'.csv','﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');break}
  }
});
document.addEventListener('input',e=>{
  if(sheet&&sheet.preview&&/^p_/.test(e.target.id))sheet.preview();
  if(e.target.id==='txq'){ui.txQuery=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('txq');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('change',e=>{
  if(sheet&&sheet.preview&&/^p_/.test(e.target.id))sheet.preview();
  if(e.target.id==='txacc'){ui.txAcc=e.target.value;render()}
  if(e.target.id==='importfile'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||!Array.isArray(s.accounts))throw 0;state=normalize(s);state.demo=false;commit('Backup wiederhergestellt');go('uebersicht')}catch(_){toast('Diese Datei ist kein gültiges Backup.')}};r.readAsText(f)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){const b=sheet.back;closeSheet();b&&b()}if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-act]'))e.target.click()});

/* ===================== Start ===================== */
(function start(){
  const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v.id===h))ui.view=h;
  state=normalize(loadLocal()||makeDemo());
  render();
  pull();
  checkAccessFile();
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(store.timer)flush()}else pull()});
  window.addEventListener('online',()=>pull());
})();
</script>

</body>
